<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Repository Browser — tnm-yes-anyidea/tnm-yes-anyidea</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;margin:0;padding:1rem;background:#f6f8fa;color:#0b1220}
    header{display:flex;align-items:center;gap:1rem}
    h1{margin:0;font-size:1.1rem}
    #path{margin:0.5rem 0 1rem}
    a.folder{color:#0366d6;text-decoration:none;font-weight:600}
    a.file{color:#0b1220;text-decoration:none}
    .list{display:grid;gap:.5rem}
    .row{display:flex;justify-content:space-between;align-items:center;padding:.5rem;border-radius:6px;background:#fff;border:1px solid #e1e4e8}
    .left{display:flex;gap:.75rem;align-items:center}
    .icon{width:18px;height:18px;display:inline-block}
    button{margin-left:.5rem}
    #viewer{margin-top:1rem;padding:1rem;background:#fff;border:1px solid #e1e4e8;border-radius:6px}
    pre{white-space:pre-wrap;word-break:break-word}
    table{border-collapse:collapse;width:100%}
    table td,table th{border:1px solid #ddd;padding:.35rem;text-align:left}
    .small{font-size:.85rem;color:#586069}
    a.raw{margin-left:8px;color:#0366d6}
  </style>
</head>
<body>
  <header>
    <h1>tnm-yes-anyidea / tnm-yes-anyidea — Browser</h1>
  </header>

  <nav id="path" class="small"></nav>
  <div id="content">
    <div id="listing" class="list"></div>
    <div id="viewer" style="display:none"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  // Configure repository owner/name
  const owner = 'tnm-yes-anyidea';
  const repo = 'tnm-yes-anyidea';
  let currentPath = '';

  function setBreadcrumbs(path){
    const nav = document.getElementById('path');
    if(!path){ nav.innerHTML = '/'; return }
    const parts = path.split('/').filter(Boolean);
    let acc = '';
    nav.innerHTML = '/ ' + parts.map((p,i)=>{
      acc += (i?'/':'') + p;
      return `<a href="#" class=small data-path="${acc}">${p}</a>`;
    }).join(' / ');
    nav.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault(); const p=a.dataset.path; navigateTo(p); }));
  }

  async function fetchDir(path){
    const api = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
    const res = await fetch(api);
    if(res.status===404){ document.getElementById('listing').innerText = 'Not found'; return []; }
    const data = await res.json();
    if(!Array.isArray(data)) return [];
    return data;
  }

  function ext(name){ return name.includes('.')?name.split('.').pop().toLowerCase():'' }
  function isImage(name){ const e=ext(name); return ['png','jpg','jpeg','gif','webp','svg'].includes(e) }

  function makeRow(item){
    const row = document.createElement('div'); row.className='row';
    const left = document.createElement('div'); left.className='left';
    const name = document.createElement('a'); name.className = item.type==='dir'?'folder':'file'; name.href = '#'; name.textContent = item.name;
    name.addEventListener('click',e=>{ e.preventDefault(); if(item.type==='dir') navigateTo((currentPath?currentPath+'/':'')+item.name); else viewFile(item); });

    const meta = document.createElement('div'); meta.className='small';
    meta.textContent = item.type==='dir' ? 'folder' : `${item.size} bytes`;

    left.appendChild(name); left.appendChild(meta);
    row.appendChild(left);

    const right = document.createElement('div');
    if(item.type==='file'){
      const v = document.createElement('button'); v.textContent='View';
      v.addEventListener('click',()=>viewFile(item));
      const raw = document.createElement('a'); raw.href = item.html_url.replace('/blob/','/raw/'); raw.target='_blank'; raw.textContent='Raw'; raw.className='raw';
      right.appendChild(v); right.appendChild(raw);
    }

    row.appendChild(right);
    return row;
  }

  async function listPath(path){
    currentPath = path || '';
    setBreadcrumbs(path);
    document.getElementById('viewer').style.display='none';
    const listing = document.getElementById('listing'); listing.innerHTML='Loading...';
    try{
      const items = await fetchDir(path);
      // ensure images folder shows up if present in git tree (API returns it)
      items.sort((a,b)=>{ if(a.type===b.type) return a.name.localeCompare(b.name); return a.type==='dir'?-1:1 });
      listing.innerHTML='';
      for(const it of items){ listing.appendChild(makeRow(it)); }
    }catch(err){ listing.innerText = 'Error: ' + err.message }
  }

  async function viewFile(item){
    const viewer = document.getElementById('viewer'); viewer.style.display='block'; viewer.innerHTML = '<div class="small">Loading file...</div>';
    try{
      const rawUrl = item.download_url || item.html_url.replace('/blob/','/raw/');
      const response = await fetch(rawUrl);
      if(!response.ok) throw new Error('Failed to fetch file');
      const text = await response.text();
      const name = item.name.toLowerCase();
      if(name.endsWith('.csv')){
        viewer.innerHTML = renderCSV(text);
      } else if(name === 'readme.md' || name.endsWith('.md')){
        viewer.innerHTML = marked.parse(text);
      } else if(name.endsWith('.tex')){
        // show .tex as readable pre block and provide rendered fallback (no LaTeX engine here)
        viewer.innerHTML = `<h3>${item.name}</h3><pre>${escapeHtml(text)}</pre>`;
      } else if(isImage(item.name)){
        viewer.innerHTML = `<img src="${rawUrl}" alt="${item.name}" style="max-width:100%"><p><a href="${rawUrl}" target=_blank>Open image</a></p>`;
      } else {
        viewer.innerHTML = `<h3>${item.name}</h3><pre>${escapeHtml(text)}</pre>`;
      }
      const dl = document.createElement('div'); dl.style.marginTop='8px'; dl.innerHTML = `<a href="${rawUrl}" target=_blank download>Download</a>`;
      viewer.appendChild(dl);
    }catch(err){ viewer.innerText = 'Failed to load file: '+err.message }
  }

  function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

  function parseCSV(text){
    const rows = [];
    let cur = '', inQuotes=false, row=[];
    for(let i=0;i<text.length;i++){
      const ch = text[i];
      if(ch==='\r') continue;
      if(ch==='"'){
        if(inQuotes && text[i+1]==='"'){ cur+='"'; i++; }
        else inQuotes=!inQuotes;
        continue;
      }
      if(ch===',' && !inQuotes){ row.push(cur); cur=''; continue }
      if(ch==='\n' && !inQuotes){ row.push(cur); rows.push(row); row=[]; cur=''; continue }
      cur+=ch;
    }
    if(cur!=='' || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

  function renderCSV(text){
    const rows = parseCSV(text);
    if(rows.length===0) return '<div>No data</div>';
    const table = document.createElement('table');
    const thead = document.createElement('thead'), tbody = document.createElement('tbody');
    const header = rows[0];
    const htr = document.createElement('tr'); header.forEach(h=>{ const th=document.createElement('th'); th.textContent=h; htr.appendChild(th)}); thead.appendChild(htr);
    for(let i=1;i<rows.length;i++){ const tr=document.createElement('tr'); rows[i].forEach(c=>{ const td=document.createElement('td'); td.textContent=c; tr.appendChild(td)}); tbody.appendChild(tr) }
    table.appendChild(thead); table.appendChild(tbody);
    return table.outerHTML;
  }

  function navigateTo(path){ listPath(path); }

  // start at root
  listPath('');
</script>
</body>
</html>
